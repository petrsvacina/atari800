<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>International Karate — původní animace</title>
<style>
  :root { color-scheme:dark; font:16px/1.6 system-ui,sans-serif; background:#171d25; color:#f5efdd }
  body { max-width:960px; margin:auto; padding:36px 20px }
  h1 { line-height:1.2; font-size:clamp(24px,4vw,40px) }
  p { max-width:740px; color:#bdc7d4 }
  #frames { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; margin-top:28px }
  figure { margin:0; text-align:center; background:#202833; border:1px solid #34404e; border-radius:8px }
  .sprite { width:80px; height:96px; margin:0 auto; background-image:url(sprites.png); image-rendering:pixelated }
  figcaption { font:12px/2 ui-monospace,monospace; color:#9aaabc }
  a { color:#f0ba61 }
</style>
<h1>International Karate</h1>
<p>Původní grafika bojovníků vytažená z dodaného ATR: 56 pozic v tabulce, z toho 53 s obrazovými daty.
  Barvy jsou pracovní náhled. Herní logika, pozadí a hudba ještě nejsou přepsané.</p>
<p>Tohle je přehled snímků pro přípravu HTML5 verze, nikoli hratelná hra.</p>
<div id="frames"></div>
<noscript><p><a href="sprites.png">Zobrazit celý list animací</a></p></noscript>
<script>
  const grid = document.querySelector('#frames');
  for (let id = 0; id < 56; id++) {
    const frame = document.createElement('figure');
    const sprite = document.createElement('div');
    sprite.className = 'sprite';
    sprite.style.backgroundPosition = `${-(id % 8) * 80}px ${-Math.floor(id / 8) * 96}px`;
    sprite.setAttribute('role', 'img');
    sprite.setAttribute('aria-label', `Snímek ${id}`);
    const label = document.createElement('figcaption');
    label.textContent = `Snímek ${id}`;
    frame.append(sprite, label);
    grid.append(frame);
  }
</script>
</html>
